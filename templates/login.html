{% include 'layout2.html' %}

<body class="text-center">
 <!-- Custom styles for this template -->
    <link href="/static/css/signin.css" rel="stylesheet">
    <style>
        .oauth-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 6px;
            text-decoration: none;
            transition: background-color 0.2s;
        }
        .oauth-button:hover {
            text-decoration: none;
            background-color: #f8f9fa;
        }
        .oauth-google { background-color: #fff; color: #757575; }
        .oauth-github { background-color: #24292e; color: #fff; }
        .oauth-apple { background-color: #000; color: #fff; }
        .oauth-divider {
            margin: 20px 0;
            text-align: center;
            position: relative;
        }
        .oauth-divider:before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #ddd;
        }
        .oauth-divider span {
            background: #fff;
            padding: 0 15px;
            color: #666;
        }
    </style>
<main class="form-signin">
  <form method="POST" action="/login">
    <img class="mb-4" src="/static/img/tumerykProxylogo.drawio.png" alt="" width="200">
    <h1 class="h3 mb-3 fw-normal">Please sign in</h1>

    <!-- OAuth Login Options -->
    <div class="mb-4">
        <a href="/auth/google" class="oauth-button oauth-google w-100">
            <svg width="18" height="18" viewBox="0 0 18 18">
                <path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18z"/>
                <path fill="#34A853" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2.04a4.8 4.8 0 0 1-7.18-2.53H1.83v2.07A8 8 0 0 0 8.98 17z"/>
                <path fill="#FBBC05" d="M4.5 10.49a4.8 4.8 0 0 1 0-3.07V5.35H1.83a8 8 0 0 0 0 7.28l2.67-2.14z"/>
                <path fill="#EA4335" d="M8.98 4.72c1.16 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 0 0 1.83 5.35L4.5 7.42a4.77 4.77 0 0 1 4.48-2.7z"/>
            </svg>
            Continue with Google
        </a>
        
        <a href="/auth/github" class="oauth-button oauth-github w-100">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
            </svg>
            Continue with GitHub
        </a>
        
        <a href="/auth/apple" class="oauth-button oauth-apple w-100">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
            </svg>
            Continue with Apple
        </a>
    </div>

    <div class="oauth-divider">
        <span>or</span>
    </div>

    <div class="form-floating">
      <input type="username" class="form-control" id="username" name="username" placeholder="Username">
      <label for="username">Username</label>
    </div>
    <div class="form-floating">
      <input type="password" class="form-control" id="password" name="password" placeholder="Password">
      <label for="password">Password</label>
    </div>

    <div class="checkbox mb-3">
      <label>
        <input type="checkbox" value="remember-me"> Remember me
      </label>
    </div>
    <button class="w-100 btn btn-lg btn-primary" type="submit">Sign in</button>
    <p class="mt-5 mb-3 text-muted">&copy; 2017–2021</p>
  </form>
</main>

<script>
// Check OAuth provider availability and hide buttons if not configured
fetch('/auth/status')
    .then(response => response.json())
    .then(status => {
        if (!status.google) {
            document.querySelector('a[href="/auth/google"]').style.display = 'none';
        }
        if (!status.github) {
            document.querySelector('a[href="/auth/github"]').style.display = 'none';
        }
        if (!status.apple) {
            document.querySelector('a[href="/auth/apple"]').style.display = 'none';
        }
        
        // Hide divider if no OAuth options are available
        const oauthButtons = document.querySelectorAll('.oauth-button');
        const visibleButtons = Array.from(oauthButtons).filter(btn => btn.style.display !== 'none');
        if (visibleButtons.length === 0) {
            document.querySelector('.oauth-divider').style.display = 'none';
        }
    })
    .catch(err => console.error('Failed to check OAuth status:', err));
</script>
